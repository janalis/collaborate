# Apache 2.4.47 or later in front of the application and of collaborate:hub:serve.
# Modules: proxy, proxy_http, headers, ssl (and proxy_fcgi for PHP-FPM). proxy_wstunnel is not needed:
# upgrade=websocket lets mod_proxy_http tunnel the upgrade.
# collaborate.hub.websocket: public_url /collaborate-hub, listen 127.0.0.1:8090.
<VirtualHost *:443>
    ServerName admin.example.com
    DocumentRoot /var/www/app/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/admin.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/admin.example.com/privkey.pem

    # The browser's Host reaches the application; its scheme too, for the token's origin
    # (list the proxy in Symfony's framework.trusted_proxies).
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Before anything else that proxies: the first matching ProxyPass wins. The path is passed whole.
    # Apache's Timeout (60 s) applies between two reads; the server pings every 25 s.
    ProxyPass        "/collaborate-hub" "http://127.0.0.1:8090/collaborate-hub" upgrade=websocket
    # Unix socket instead (listen: unix:///run/collaborate/hub.sock):
    # ProxyPass "/collaborate-hub" "unix:/run/collaborate/hub.sock|http://localhost/collaborate-hub" upgrade=websocket

    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
