name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  php:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['7.4.*', '8.1.*']
        database: ['mariadb:11.4']
        include:
          - php: '8.5'
            symfony: '8.1.*'
            database: 'mariadb:10.11'
          # MySQL returns JSON reformatted, its object keys sorted: the journal must not tell the difference.
          - php: '8.5'
            symfony: '8.1.*'
            database: 'mysql:8.4'
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
          MYSQL_ALLOW_EMPTY_PASSWORD: '1'
          MYSQL_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ startsWith(matrix.database, 'mysql') && 'mysqladmin ping -h 127.0.0.1 --silent' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # The functional tests own this database; the integration tests create collaborate_<app>_test next to it.
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=${{ startsWith(matrix.database, 'mysql') && '8.4.0' || '10.11.0-MariaDB' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl
          coverage: none
          tools: composer:v2, flex
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: composer update --no-interaction --prefer-dist
      # The test applications' pages load CKEditor, Bootstrap and the bundle's styles from node_modules.
      - name: Build the test applications' assets
        run: npm ci && node tests/Application/bin/setup-assets.mjs
      - name: Unit, functional and tools suites
        run: vendor/bin/phpunit --testsuite unit,functional,tools
      - name: Integration suite (the bundle in an application with and without EasyAdmin)
        run: vendor/bin/phpunit --testsuite integration

  coverage:
    name: Coverage (100% of PHP statements and methods, every JS metric)
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=10.11.0-MariaDB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl
          coverage: pcov
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && node tests/Application/bin/setup-assets.mjs
      - run: make coverage

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-lowest --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite unit

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer format:check
      - run: composer lint
      - run: composer analyze
      - run: composer audit
      - name: markdownlint
        run: npm ci --prefix docs && docs/node_modules/.bin/markdownlint-cli2
      # Go is preinstalled on the runner; the Makefile pins both tools' versions.
      - name: editorconfig-checker
        run: make lint-editorconfig
      - name: actionlint
        run: make lint-actions

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make lint-js
      - run: npm run test:coverage

  infection:
    name: Mutation testing
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=10.11.0-MariaDB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl
          coverage: pcov
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && node tests/Application/bin/setup-assets.mjs
      # minMsi and minCoveredMsi in infection.json5.dist fail the job below the measured scores.
      - run: make infection ARGS="--no-progress --logger-github"

  e2e:
    name: Browser scenarios (Playwright)
    # Playwright 1.59 installs its browsers on Ubuntu 24.04 at most.
    runs-on: ubuntu-24.04
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=10.11.0-MariaDB
      FRANKENPHP_VERSION: v1.13.4
      FRANKENPHP: /usr/local/bin/frankenphp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      # The static build embeds PHP (with pdo_mysql) and the Mercure hub module.
      - name: Install FrankenPHP
        run: |
          sudo curl -fsSL -o "$FRANKENPHP" \
            "https://github.com/php/frankenphp/releases/download/${FRANKENPHP_VERSION}/frankenphp-linux-x86_64"
          sudo chmod +x "$FRANKENPHP"
          "$FRANKENPHP" version
          "$FRANKENPHP" list-modules | grep -x http.handlers.mercure
      - run: npx playwright install --with-deps chromium
      - run: make e2e
