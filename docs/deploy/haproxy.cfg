# HAProxy (2.4 or later) in front of the application and of collaborate:hub:serve.
# collaborate.hub.websocket: public_url /collaborate-hub, listen 127.0.0.1:8090, publish_listen 127.0.0.1:8091.
#
# HAProxy forwards the upgrade on its own, and offers WebSockets over HTTP/2 (RFC 8441) to browsers.
defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    # An upgraded connection is a tunnel: this timeout replaces the two above once it is established.
    # Above ping_interval (25 s).
    timeout tunnel 1h
    timeout client-fin 30s
    option forwardfor

frontend https
    bind :443 ssl crt /etc/haproxy/certs/admin.example.com.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    acl collaborate_hub path /collaborate-hub
    use_backend collaborate_hub if collaborate_hub
    default_backend app

backend collaborate_hub
    # The health check asks the private side, on the same host.
    option httpchk
    http-check send meth GET uri /health
    server hub 127.0.0.1:8090 check port 8091
    # Unix socket instead: server hub unix@/run/collaborate/hub.sock (no port check: check the socket).

backend app
    server app 127.0.0.1:8080 check
