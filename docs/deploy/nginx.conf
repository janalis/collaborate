# nginx in front of the application and of collaborate:hub:serve, TCP upstream.
# collaborate.hub.websocket: public_url /collaborate-hub, listen 127.0.0.1:8090 (the default).
#
# The map goes in the http block (conf.d/ files are included there): Connection is "upgrade" for an
# upgrade, "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream collaborate_hub {
    server 127.0.0.1:8090;
}

server {
    listen 443 ssl;
    http2 on;   # Browsers still open the WebSocket over HTTP/1.1: nginx does not offer RFC 8441.
    server_name admin.example.com;

    ssl_certificate     /etc/ssl/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/admin.example.com/privkey.pem;

    root /var/www/app/public;

    # Exact match: checked before the regex locations below, and nothing else under the path is proxied.
    location = /collaborate-hub {
        # No URI after the address (no path, not even "/"): nginx passes the request's path unchanged.
        # "proxy_pass http://collaborate_hub/;" would send "/" instead, which the server answers with 404
        # unless collaborate.hub.websocket.path is "/".
        proxy_pass http://collaborate_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin is forwarded as the browser sent it: never rewrite it.
        # Both default to 60 s; the server pings every ping_interval (25 s). Keep both above it.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        # proxy_buffering does not apply to an upgraded connection: nothing to turn off.
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
