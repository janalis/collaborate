name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  php:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['7.4.*', '8.1.*']
        database: ['mariadb:11.4']
        include:
          - php: '8.5'
            symfony: '8.1.*'
            database: 'mariadb:10.11'
          # MySQL returns JSON reformatted, its object keys sorted: the journal must not tell the difference.
          - php: '8.5'
            symfony: '8.1.*'
            database: 'mysql:8.4'
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
          MYSQL_ALLOW_EMPTY_PASSWORD: '1'
          MYSQL_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ startsWith(matrix.database, 'mysql') && 'mysqladmin ping -h 127.0.0.1 --silent' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # The journal's dialects on PostgreSQL (DraftJournalPlatformsTest); SQLite needs no server.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collaborate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # The functional tests own this database; the integration tests create collaborate_<app>_test next to it.
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=${{ startsWith(matrix.database, 'mysql') && '8.4.0' || '10.11.0-MariaDB' }}
      COLLABORATE_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/collaborate_test?serverVersion=16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, mbstring, intl, pcntl
          coverage: none
          tools: composer:v2, flex
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: composer update --no-interaction --prefer-dist
      # The test applications' pages load CKEditor, Bootstrap and the bundle's styles from node_modules.
      - name: Build the test applications' assets
        run: npm ci && node tests/Application/bin/setup-assets.mjs
      - name: Unit, functional and tools suites
        run: vendor/bin/phpunit --testsuite unit,functional,tools
      - name: Integration suite (the bundle in an application with and without EasyAdmin)
        run: vendor/bin/phpunit --testsuite integration

  coverage:
    name: Coverage (100% of PHP statements and methods, every JS metric)
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # The journal's dialects on PostgreSQL (DraftJournalPlatformsTest); SQLite needs no server.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collaborate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=10.11.0-MariaDB
      COLLABORATE_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/collaborate_test?serverVersion=16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, mbstring, intl, pcntl
          coverage: pcov
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && node tests/Application/bin/setup-assets.mjs
      - run: make coverage

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-lowest --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite unit

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer format:check
      - run: composer lint
      - run: composer analyze
      - run: composer audit
      - name: markdownlint
        run: npm ci --prefix docs && docs/node_modules/.bin/markdownlint-cli2
      # Go is preinstalled on the runner; the Makefile pins both tools' versions.
      - name: editorconfig-checker
        run: make lint-editorconfig
      - name: actionlint
        run: make lint-actions

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make lint-js
      - run: npm run test:coverage

  infection:
    name: Mutation testing
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # The journal's dialects on PostgreSQL (DraftJournalPlatformsTest); SQLite needs no server.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collaborate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=10.11.0-MariaDB
      COLLABORATE_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/collaborate_test?serverVersion=16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, mbstring, intl, pcntl
          coverage: pcov
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && node tests/Application/bin/setup-assets.mjs
      # minMsi and minCoveredMsi in infection.json5.dist fail the job below the measured scores.
      - run: make infection ARGS="--no-progress --logger-github"

  e2e:
    name: Browser scenarios (Playwright)
    # Playwright 1.59 installs its browsers on Ubuntu 24.04 at most.
    runs-on: ubuntu-24.04
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=10.11.0-MariaDB
      FRANKENPHP_VERSION: v1.13.4
      FRANKENPHP: /usr/local/bin/frankenphp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-setup
      - run: make e2e

  drupal:
    name: Drupal module (Drupal ${{ matrix.drupal }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        drupal: ['^11.4']
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # The module's tests on a PostgreSQL site (Drupal 11 asks for 16+); SQLite needs no server.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collaborate_drupal
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=10.11.0-MariaDB
      DRUPAL_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_drupal
      FRANKENPHP_VERSION: v1.13.4
      FRANKENPHP: /usr/local/bin/frankenphp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-setup
      - name: Pin Drupal
        run: composer require --no-update --working-dir=tests/Application/Drupal "drupal/core-recommended:${{ matrix.drupal }}" "drupal/core-composer-scaffold:${{ matrix.drupal }}"
      - run: make drupal-install
      # The module's assets are committed: a partial changed without `make drupal-assets` fails here.
      - name: The module's built assets are current
        run: make drupal-assets && git diff --exit-code drupal/css assets/vendor
      # The site's PHP on PHP's server, its origin and Mercure hub on FrankenPHP, as Playwright starts them.
      - name: Serve the site
        run: |
          (cd tests/Application/Drupal/web && PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8791 .ht.router.php > /tmp/php.log 2>&1 &)
          "$FRANKENPHP" run --config tests/Application/Drupal/Caddyfile > /tmp/frankenphp.log 2>&1 &
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8790/user/login && break; sleep 1; done
      - run: make drupal-test
      - name: The module's tests on PostgreSQL and SQLite sites
        run: |
          make drupal-test DRUPAL_TEST_DATABASE_URL=pgsql://postgres:postgres@127.0.0.1:5432/collaborate_drupal
          make drupal-test DRUPAL_TEST_DATABASE_URL="sqlite://localhost/$RUNNER_TEMP/drupal.sqlite"
      # Playwright starts the test applications' servers too: they need their databases.
      - run: make app-setup
      - run: make drupal-e2e
