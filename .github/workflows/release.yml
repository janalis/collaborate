name: release
# Actions → release → Run workflow (on main). Verifies, moves CHANGELOG's [Unreleased] section to the new
# version, makes the Drupal module require it (drupal/composer.json), commits and tags it, then publishes the
# GitHub release with that section as its notes, pings Packagist (janalis/collaborate, from the tag), pushes the
# module's split with the same version (drupal-split.yml: janalis/collaborate_drupal, drupal.org), opens the
# issue that hands drupal.org's "Create release" to a maintainer, and refreshes the documentation site.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z, or patch | minor | major (bump of the latest tag)"
        required: true
        default: patch
      dry_run:
        description: "Verify and prepare everything, push and publish nothing"
        type: boolean
        default: false
concurrency: release
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.relprep.outputs.version }}
      tag: ${{ steps.relprep.outputs.tag }}
      module_tag: ${{ steps.relprep.outputs.module_tag }}
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: collaborate_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COLLABORATE_DATABASE_URL: mysql://root@127.0.0.1:3306/collaborate_test?serverVersion=11.4.0-MariaDB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Composer and npm dependencies, and the test applications' assets the integration suite renders.
      - run: make install
      # The ci workflow already ran markdownlint, editorconfig-checker and actionlint on this commit.
      - run: make verify MDLINT= EDITORCONFIG= ACTIONLINT=
      - id: relprep
        env:
          BUMP: ${{ inputs.version }}
        run: php tools/relprep.php --bump "$BUMP" --notes "$RUNNER_TEMP/notes.md" --module drupal/composer.json | tee -a "$GITHUB_OUTPUT"
      - run: git diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
      - if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.relprep.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag -a "$TAG" -m "janalis/collaborate $TAG"
          git push --atomic origin HEAD:main "$TAG"

  # Separate job so a failed publish can be retried ("Re-run failed jobs") without cutting the release again.
  publish:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      # The release's scripts (.github/scripts).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
      # Packagist's GitHub hook already picks up the tag; this makes it immediate.
      - env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: .github/scripts/packagist-update.sh "https://github.com/$GITHUB_REPOSITORY"

  # The Drupal module, released with the bundle: its split tagged X.Y.Z on GitHub and drupal.org.
  drupal:
    needs: [prepare, publish]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/drupal-split.yml
    with:
      tag: ${{ needs.prepare.outputs.module_tag }}
    secrets:
      SPLIT_DEPLOY_KEY: ${{ secrets.SPLIT_DEPLOY_KEY }}
      DRUPALORG_SSH_KEY: ${{ secrets.DRUPALORG_SSH_KEY }}

  # Packagist reads the split's tag; drupal.org's release page is created by hand, from the issue opened here.
  drupal-publish:
    needs: [prepare, drupal]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: .github/scripts/packagist-update.sh https://github.com/janalis/collaborate_drupal
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring
          coverage: none
      - name: drupal.org release checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_DRUPALORG: ${{ secrets.DRUPALORG_SSH_KEY != '' }}
          TAG: ${{ needs.prepare.outputs.module_tag }}
        run: |
          if [ "$HAS_DRUPALORG" != true ]; then
            echo "::notice::No drupal.org deploy key: the tag is not on drupal.org, no checklist to open."
            exit 0
          fi
          php tools/drupalorg.php release-issue "$TAG" "$RUNNER_TEMP/notes.md"

  # Refresh the documentation site (changelog, version in the nav).
  docs:
    needs: [prepare, publish]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
