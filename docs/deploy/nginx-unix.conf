# nginx in front of the application and of collaborate:hub:serve, unix socket upstream.
# collaborate.hub.websocket:
#   public_url:     /collaborate-hub
#   listen:         unix:///run/collaborate/hub.sock
#   publish_listen: unix:///run/collaborate/publish.sock
#   publish_url:    http://localhost
#   publish_socket: /run/collaborate/publish.sock
#   socket_mode:    0660
#
# nginx's user must be able to open the socket: in the group of the server's user (systemd's
# RuntimeDirectory=collaborate is 0750, owned by that user and group), since socket_mode is 0660.
# PHP-FPM's user publishes through publish.sock: same group.
#
# The map goes in the http block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream collaborate_hub {
    server unix:/run/collaborate/hub.sock;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/ssl/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/admin.example.com/privkey.pem;

    root /var/www/app/public;

    location = /collaborate-hub {
        # No URI after the upstream: the path reaches the server unchanged.
        proxy_pass http://collaborate_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
