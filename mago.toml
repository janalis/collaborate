php-version = "8.4.0"

[source]
paths = ["src", "tests", "config"]
includes = ["vendor"]

[formatter]
print-width = 120

[linter]
integrations = ["symfony", "phpunit"]

# Keep formatting policy separate from heuristic complexity estimates.
# Sized to the draft journal (one class per protocol, see below), so larger classes still get flagged.
[linter.rules.cyclomatic-complexity]
threshold = 250
[linter.rules.kan-defect]
enabled = false
[linter.rules.halstead]
enabled = false
[linter.rules.literal-named-argument]
enabled = false
[linter.rules.no-boolean-flag-parameter]
enabled = false
[linter.rules.assertion-style]
style = "self"

# The draft journal, its form extension and the plain-text operation transformer each keep one
# protocol in one class: their branching and size are those of the protocol, and splitting them
# would spread one lock's or one operation's rules over several files.
[linter.rules.too-many-methods]
threshold = 60
exclude = ["tests/"]
[linter.rules.too-many-properties]
threshold = 30
exclude = ["tests/"]
# The form extension and the journal take their limits and collaborators as constructor arguments.
[linter.rules.excessive-parameter-list]
threshold = 20
# Test kernels and fixtures carry throwaway secrets.
[linter.rules.no-literal-password]
exclude = ["tests/"]
# Assertions read clearly from their values; `else`, `isset()` and best-effort empty catches are idiomatic here.
[linter.rules.assert-description]
enabled = false
[linter.rules.no-else-clause]
enabled = false
[linter.rules.no-isset]
enabled = false
[linter.rules.no-empty-catch-clause]
enabled = false
