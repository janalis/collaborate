name: docs
# Builds the documentation site (VitePress, docs/) and deploys it to GitHub Pages. Pull requests only
# build it (dead links fail the build). The release workflow calls it after publishing so the changelog
# and the version in the navigation bar are current.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (the release tag)"
        type: string
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags for the version in the nav, history for "last updated".
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: markdownlint
        run: docs/node_modules/.bin/markdownlint-cli2
      - run: npm run build
        working-directory: docs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
