'Connecting to the shared draft…': 'Connexion au brouillon partagé…'
'Shared draft saved.': 'Brouillon partagé enregistré.'
'Shared draft has unsaved changes.': 'Le brouillon partagé contient des modifications non enregistrées.'
'Synchronizing changes…': 'Synchronisation des modifications…'
