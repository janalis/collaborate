# Gateway API: the browser side of collaborate:hub:serve on a path of the application's own host. Gateway
# implementations (Envoy Gateway, Istio, NGINX Gateway Fabric, Cilium…) forward WebSocket upgrades on an
# HTTPRoute with no extra setting as a rule; check your implementation's documentation.
#
# Set no request timeout on the hub's rule (spec.rules[].timeouts): it would cap every socket's lifetime.
# Idle timeouts above ping_interval (25 s) are fine. On GKE, the load balancer's backend timeout (30 s by
# default) caps a socket's lifetime: raise it with a GCPBackendPolicy on the collaborate-hub Service
# (spec.default.timeoutSec: 3600).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - admin.example.com
  rules:
    # The exact path, passed unchanged (no URLRewrite filter): the server upgrades that path alone.
    - matches:
        - path:
            type: Exact
            value: /collaborate-hub
      backendRefs:
        - name: collaborate-hub
          port: 8090
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: admin
          port: 80
