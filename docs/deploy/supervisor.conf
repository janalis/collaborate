; /etc/supervisor/conf.d/collaborate-hub.conf
; supervisorctl reread && supervisorctl update
; Restart it on every deployment: supervisorctl restart collaborate-hub
;
; One descriptor per connection: supervisord passes its own limit on, set by minfds in its
; [supervisord] section (minfds=65536), above max_connections.
; With unix sockets, create their directory (e.g. /run/collaborate, mode 0750, owned by the user below)
; before supervisord starts the program: supervisor has no RuntimeDirectory.
[program:collaborate-hub]
command=php bin/console collaborate:hub:serve --no-interaction
directory=/var/www/app
user=www-data
environment=APP_ENV="prod"
; One instance only: the server holds every connection.
numprocs=1
autostart=true
autorestart=true
startsecs=2
; SIGTERM: the server closes every socket with 1001 and stops within shutdown_timeout (10 s).
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/collaborate-hub.log
